<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 1 — Station at Dusk</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Nunito', sans-serif;
        }
        .slide-wrapper {
            width: 375px;
            height: 812px;
            position: relative;
            overflow: hidden;
            background: #1a1a2e;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
        }
        .px-scene {
            width: 100%;
            height: 450px;
            position: relative;
            background: linear-gradient(180deg, #2d1b69 0%, #4a2c8a 20%, #7b4f6e 40%, #c47451 55%, #e8a87c 65%);
        }
        .star {
            position: absolute;
            width: 2px; height: 2px; background: #fff;
            box-shadow: 30px 20px 0 #fff, 80px 40px 0 #fff, 150px 15px 0 #fff,
                200px 50px 0 #fff, 280px 30px 0 #fff, 320px 10px 0 #fff,
                50px 60px 0 #fff, 120px 25px 0 #fff, 250px 45px 0 #fff;
        }
        .moon {
            position: absolute; top: 30px; right: 60px;
            width: 24px; height: 24px; background: #f5e6ca;
            border-radius: 50%; box-shadow: 0 0 20px rgba(245,230,202,0.5);
        }
        .station-building {
            position: absolute; bottom: 100px; left: 30px;
            width: 160px; height: 120px; background: #4a3f35; border: 2px solid #3a2f25;
        }
        .station-building::before {
            content: ''; position: absolute; top: -30px; left: -10px;
            width: 180px; height: 30px; background: #3a2f25;
            clip-path: polygon(10% 100%, 50% 0%, 90% 100%);
        }
        .station-sign {
            position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
            background: #1a3a5c; color: #ffd699; font-size: 7px; font-weight: 900;
            padding: 5px 12px; letter-spacing: 1px; border: 1px solid #2a5a8c;
        }
        .station-window {
            position: absolute; width: 20px; height: 24px;
            background: #ffd699; border: 1px solid #3a2f25;
            box-shadow: 0 0 8px rgba(255,214,153,0.6);
        }
        .sw1 { top: 20px; left: 18px; } .sw2 { top: 20px; left: 58px; }
        .sw3 { top: 20px; left: 98px; } .sw4 { top: 60px; left: 18px; }
        .sw5 { top: 60px; left: 58px; } .sw6 { top: 60px; left: 98px; }
        .street-lamp { position: absolute; bottom: 100px; right: 70px; }
        .lamp-head { width: 18px; height: 10px; background: #444; border-radius: 3px 3px 0 0; margin: 0 auto; }
        .lamp-light {
            width: 12px; height: 6px; background: #ffd699; margin: 0 auto;
            box-shadow: 0 4px 30px rgba(255,214,153,0.8), 0 8px 60px rgba(255,214,153,0.3);
            border-radius: 0 0 5px 5px;
        }
        .lamp-pole { width: 4px; height: 70px; background: #555; margin: 0 auto; }
        .ground {
            position: absolute; bottom: 0; left: 0; right: 0; height: 100px;
            background: #3a3a3a; border-top: 3px solid #555;
        }
        .character { position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); }
        .char { display: flex; flex-direction: column; align-items: center; }
        .char-hair { width: 18px; height: 7px; background: #2a1a0a; border-radius: 3px 3px 0 0; }
        .char-head { width: 16px; height: 16px; background: #f5c6a0; border-radius: 2px; margin-top: -1px; }
        .char-body { width: 18px; height: 22px; background: #4a7ab5; }
        .char-legs { display: flex; gap: 2px; }
        .char-leg { width: 7px; height: 14px; background: #3a3a5a; }
        .char-shoe { width: 9px; height: 4px; background: #2a2a2a; }
        .suitcase {
            position: absolute; width: 14px; height: 18px; background: #8b4513;
            border: 1px solid #6b3510; border-radius: 1px;
        }
        .suitcase::before {
            content: ''; position: absolute; top: -5px; left: 3px; width: 8px; height: 5px;
            border: 1px solid #6b3510; border-bottom: none; border-radius: 2px 2px 0 0;
        }
        .suitcase::after {
            content: ''; position: absolute; top: 2px; left: 0; right: 0;
            height: 2px; background: #a05515;
        }
        .sc1 { bottom: 100px; left: calc(50% - 28px); }
        .sc2 { bottom: 100px; left: calc(50% + 14px); }
        .text-area {
            height: 362px; background: #1a1a2e; padding: 28px 24px 30px;
            display: flex; flex-direction: column; justify-content: center;
        }
        .narrator {
            color: #e8d5b5; font-size: 15px; font-weight: 700; line-height: 1.8; margin-bottom: 16px;
        }
        .narrator em { color: #ffd699; font-style: normal; font-weight: 800; }
        .thought {
            color: #a8a8c8; font-size: 14px; font-weight: 600; font-style: italic;
            border-left: 3px solid #555; padding-left: 14px; margin: 12px 0; line-height: 1.7;
        }
        .slide-counter {
            position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
            color: #666; font-size: 11px; font-weight: 700; z-index: 100;
            background: rgba(26,26,46,0.8); padding: 4px 12px; border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="slide-wrapper">
        <div class="slide-counter">Slide 1 / 20</div>
        <div class="px-scene">
            <div class="star"></div>
            <div class="moon"></div>
            <div class="station-building">
                <div class="station-sign">OAKFIELD STATION</div>
                <div class="station-window sw1"></div>
                <div class="station-window sw2"></div>
                <div class="station-window sw3"></div>
                <div class="station-window sw4"></div>
                <div class="station-window sw5"></div>
                <div class="station-window sw6"></div>
            </div>
            <div class="street-lamp">
                <div class="lamp-head"></div>
                <div class="lamp-light"></div>
                <div class="lamp-pole"></div>
            </div>
            <div class="character">
                <div class="char">
                    <div class="char-hair"></div>
                    <div class="char-head"></div>
                    <div class="char-body"></div>
                    <div class="char-legs">
                        <div><div class="char-leg"></div><div class="char-shoe"></div></div>
                        <div><div class="char-leg"></div><div class="char-shoe"></div></div>
                    </div>
                </div>
            </div>
            <div class="suitcase sc1"></div>
            <div class="suitcase sc2"></div>
            <div class="ground"></div>
        </div>
        <div class="text-area">
            <div class="narrator">
                You step out of the station.<br>
                <em>Two suitcases. One backpack.</em><br>
                Your phone shows <em>11%</em> battery.
            </div>
            <div class="thought">
                "Okay. New city. No place to sleep tonight."
            </div>
        </div>
    </div>
</body>
</html>
