<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 15 — Cafe at Night</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #111;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; font-family: 'Nunito', sans-serif;
        }
        .slide-wrapper {
            width: 375px; height: 812px; position: relative;
            overflow: hidden; background: #1a1a2e;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
        }
        .px-scene {
            width: 100%; height: 450px; position: relative;
            background: linear-gradient(180deg, #0d1b2a 0%, #1b2838 30%, #2a3a4a 50%);
        }
        .star {
            position: absolute; width: 2px; height: 2px; background: #fff;
            box-shadow: 40px 20px 0 #fff, 180px 40px 0 #fff, 300px 15px 0 #fff;
        }
        .cafe-building {
            position: absolute; bottom: 80px; left: 15px; right: 15px;
            height: 220px; background: #8b6914; border: 2px solid #6b4f10;
        }
        .cafe-awning {
            position: absolute; top: -12px; left: -5px; right: -5px; height: 22px;
            background: repeating-linear-gradient(90deg, #c44, #c44 15px, #fff 15px, #fff 30px);
            clip-path: polygon(0 0, 100% 0, 96% 100%, 4% 100%);
        }
        .cafe-sign {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            background: #2a1a0a; color: #ffd699; font-size: 8px; font-weight: 900;
            padding: 6px 16px; border: 1px solid #ffd699; letter-spacing: 2px;
        }
        .cafe-window {
            position: absolute; width: 70px; height: 80px;
            background: #ffd699; border: 2px solid #6b4f10;
            box-shadow: 0 0 30px rgba(255,214,153,0.4);
        }
        .cafe-window::before {
            content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 2px; height: 100%; background: #6b4f10;
        }
        .cafe-window::after {
            content: ''; position: absolute; top: 50%; left: 0; width: 100%; height: 2px; background: #6b4f10;
        }
        .cw1 { top: 45px; left: 25px; }
        .cw2 { top: 45px; right: 25px; }
        .cafe-door {
            position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 34px; height: 65px; background: #6b4f10; border: 1px solid #4a3510;
        }
        .cafe-door::before {
            content: ''; position: absolute; top: 50%; right: 6px;
            width: 4px; height: 4px; background: #ffd699; border-radius: 50%;
        }
        .interior-person {
            position: absolute; width: 10px; height: 14px; border-radius: 5px 5px 0 0;
        }
        .interior-table {
            position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
            width: 24px; height: 3px; background: #6b4f10; border-radius: 1px;
        }
        .pavement {
            position: absolute; bottom: 0; left: 0; right: 0; height: 80px;
            background: #4a4a5a; border-top: 3px solid #666;
        }
        .street-lamp { position: absolute; bottom: 80px; left: 25px; }
        .lamp-head { width: 18px; height: 10px; background: #444; border-radius: 3px 3px 0 0; margin: 0 auto; }
        .lamp-light {
            width: 12px; height: 6px; background: #ffd699; margin: 0 auto;
            box-shadow: 0 4px 30px rgba(255,214,153,0.8);
            border-radius: 0 0 5px 5px;
        }
        .lamp-pole { width: 4px; height: 70px; background: #555; margin: 0 auto; }

        /* Character sitting with phone */
        .sitting-char {
            position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
        }
        .sitting-char .char-hair { width: 18px; height: 7px; background: #2a1a0a; border-radius: 3px 3px 0 0; }
        .sitting-char .char-head { width: 16px; height: 16px; background: #f5c6a0; border-radius: 2px; margin-top: -1px; }
        .sitting-char .char-body { width: 18px; height: 20px; background: #4a7ab5; }
        .phone-glow {
            width: 10px; height: 16px; background: #4488cc; border-radius: 2px;
            margin: 4px auto 0;
            box-shadow: 0 0 15px rgba(68,136,204,0.6);
        }

        .suitcase {
            position: absolute; width: 14px; height: 18px; background: #8b4513;
            border: 1px solid #6b3510; border-radius: 1px;
        }
        .suitcase::before {
            content: ''; position: absolute; top: -5px; left: 3px; width: 8px; height: 5px;
            border: 1px solid #6b3510; border-bottom: none; border-radius: 2px 2px 0 0;
        }
        .sc1 { bottom: 80px; left: calc(50% - 35px); }
        .sc2 { bottom: 80px; left: calc(50% + 20px); }

        /* Receipt floating */
        .receipt {
            position: absolute; bottom: 100px; left: calc(50% + 40px);
            width: 40px; height: 50px; background: #f5f0e8; border: 1px solid #ccc;
            transform: rotate(5deg); font-size: 3px; color: #666; padding: 4px;
            line-height: 1.4;
        }
        .receipt-total {
            font-weight: 900; font-size: 5px; color: #333;
            border-top: 1px solid #ccc; padding-top: 2px; margin-top: 2px;
        }

        .text-area {
            height: 362px; background: #1a1a2e; padding: 28px 24px 30px;
            display: flex; flex-direction: column; justify-content: center;
        }
        .narrator {
            color: #e8d5b5; font-size: 15px; font-weight: 700; line-height: 1.8; margin-bottom: 16px;
        }
        .narrator em { color: #ffd699; font-style: normal; font-weight: 800; }
        .thought {
            color: #a8a8c8; font-size: 14px; font-weight: 600; font-style: italic;
            border-left: 3px solid #555; padding-left: 14px; margin: 12px 0; line-height: 1.7;
        }
        .slide-counter {
            position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
            color: #666; font-size: 11px; font-weight: 700; z-index: 100;
            background: rgba(26,26,46,0.8); padding: 4px 12px; border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="slide-wrapper">
        <div class="slide-counter">Slide 15 / 20</div>
        <div class="px-scene">
            <div class="star"></div>
            <div class="cafe-building">
                <div class="cafe-awning"></div>
                <div class="cafe-sign">CAFE</div>
                <div class="cafe-window cw1">
                    <div class="interior-table"></div>
                    <div class="interior-person" style="background:#4a4a6a;left:8px;bottom:20px;"></div>
                    <div class="interior-person" style="background:#6a4a4a;right:8px;bottom:20px;"></div>
                </div>
                <div class="cafe-window cw2">
                    <div class="interior-table"></div>
                    <div class="interior-person" style="background:#4a6a4a;left:10px;bottom:20px;"></div>
                </div>
                <div class="cafe-door"></div>
            </div>
            <div class="street-lamp">
                <div class="lamp-head"></div>
                <div class="lamp-light"></div>
                <div class="lamp-pole"></div>
            </div>
            <div class="sitting-char">
                <div class="char-hair"></div>
                <div class="char-head"></div>
                <div class="char-body"></div>
                <div class="phone-glow"></div>
            </div>
            <div class="suitcase sc1"></div>
            <div class="suitcase sc2"></div>
            <div class="receipt">
                Coffee<br>
                —————<br>
                <div class="receipt-total">3.80</div>
            </div>
            <div class="pavement"></div>
        </div>
        <div class="text-area">
            <div class="narrator">
                It's fully dark now.<br>
                You find a caf and order a <em>coffee</em>.<br>
                It's <em>3.80</em>.
            </div>
            <div class="thought">
                "Two suitcases. No flat yet.<br>
                But I know more than I did an hour ago."
            </div>
        </div>
    </div>
</body>
</html>
